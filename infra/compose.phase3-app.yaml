name: service-desk-phase3-app
x-app: &app
  image: sha256:31aa2bd6e7849f6adadeeaa60ffd687fb19252618d35dc84d27d4453a1d68ffc
  read_only: true
  user: "0:0"
  cap_drop: [ALL]
  cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP]
  security_opt: [no-new-privileges:true]
  mem_limit: 256m
  cpus: 1
  pids_limit: 64
  logging: {driver: none}
services:
  browser:
    <<: *app
    command: [browser]
    ports: ["127.0.0.1:19481:19481"]
    volumes: ["../.lab/phase3-app/browser:/run/desk:ro"]
    networks: [browser]
  agent:
    <<: *app
    command: [agent]
    ports: ["127.0.0.1:19486:19486"]
    volumes: ["../.lab/phase3-app/agent:/run/desk:ro"]
    networks: [agent]
  publisher:
    <<: *app
    command: [publisher]
    ports: ["127.0.0.1:19487:19487"]
    volumes: ["../.lab/phase3-app/publisher:/run/desk:ro"]
    networks: [publisher]
networks:
  browser: {}
  agent: {}
  publisher: {}
