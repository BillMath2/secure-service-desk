# Separate trusted download project. Stop it before starting any unsafe services.
name: service-desk-baseline-preload
services:
  preload:
    image: ollama/ollama:0.40.3@sha256:adca95a12c2b386a8f9a995e7fa0600e187e3323b5e5522f5a6c3b1ec73eff99
    environment:
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "1"
    volumes: ["model_cache:/models"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 64
    logging:
      driver: none
volumes:
  model_cache:
    name: service-desk-baseline-model
