# Deliberately unsafe tools; no host ports or host bind mounts. Entry via docker exec only.
name: service-desk-baseline
x-app: &app
  image: service-desk-baseline:phase1
  build:
    context: ..
    dockerfile: infra/baseline.Dockerfile
  networks: [attack]
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 512m
  pids_limit: 64
  cpus: 1
  tmpfs: ["/tmp:size=64m,mode=1777"]
  init: true
  logging:
    driver: none
services:
  knowledge:
    <<: *app
    command: [python, -m, lab_baseline.server, knowledge]
  tickets:
    <<: *app
    command: [python, -m, lab_baseline.server, tickets]
  access:
    <<: *app
    command: [python, -m, lab_baseline.server, access]
  runner:
    <<: *app
    command: [python, -c, "import time; time.sleep(900)"]
    tmpfs: ["/tmp:size=64m,mode=1777", "/results:size=16m,mode=1777"]
  sink:
    <<: *app
    command: [uvicorn, "service_desk.sink:create_sink", --factory, --host, "0.0.0.0", --port, "8080", --no-access-log, --log-level, critical]
  model:
    image: ollama/ollama:0.40.3@sha256:adca95a12c2b386a8f9a995e7fa0600e187e3323b5e5522f5a6c3b1ec73eff99
    networks: [attack]
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      HOME: /tmp
      OLLAMA_MODELS: /models
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes: ["model_cache:/models:ro"]
    tmpfs: ["/tmp:size=512m,mode=1777"]
    mem_limit: 8g
    cpus: 4
    pids_limit: 256
    gpus: all
    logging:
      driver: none
  protected-sentinel:
    <<: *app
    networks: [protected]
    command: [python, -m, http.server, "8080", --directory, /tmp]
networks:
  attack:
    internal: true
  protected:
    internal: true
volumes:
  model_cache:
    external: true
    name: service-desk-baseline-model
