<!doctype html><html><meta charset="utf-8"><title>Secure Service Desk | Evidence walkthrough</title><style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#091623!important;color:#edf5fc;font-family:Segoe UI,Arial,sans-serif}body{padding:64px 86px}header{display:flex;justify-content:space-between;color:#69dac5;font-size:23px;letter-spacing:3px}header span:last-child{color:#91a9c0;font-size:20px;letter-spacing:1px}.kicker{margin-top:72px;color:#69dac5;font-size:25px;text-transform:uppercase;letter-spacing:3px}h1{font-size:68px;line-height:1.12;margin:22px 0 34px;max-width:1680px;font-weight:650}.content{font-size:31px;line-height:1.48}.grid{display:grid;grid-template-columns:1fr 1fr;gap:32px}.card{background:#14283e;border:1px solid #29455f;border-radius:18px;padding:30px 34px}.accent{border-left:6px solid #69dac5}.amber{color:#ffcf7b}.muted{color:#9eb4c9}.metric{font-size:70px;color:#69dac5;font-weight:600}p{margin:10px 0 22px}h2{font-size:32px;margin:0 0 18px}table{width:100%;border-collapse:collapse;font-size:29px}td,th{padding:17px 20px;border-bottom:1px solid #29455f;text-align:left}th{font-weight:500;color:#a9bed2}.code{font:24px Consolas,monospace;overflow-wrap:anywhere}.pill{display:inline-block;padding:8px 14px;border:1px solid #42667e;border-radius:8px;margin:6px;font-size:25px}footer{position:absolute;left:86px;right:86px;bottom:54px;display:flex;justify-content:space-between;gap:30px;color:#91a9c0;font-size:21px}#source{max-width:1550px;overflow-wrap:anywhere}#bar{position:absolute;left:0;bottom:0;height:6px;background:#69dac5;width:0;transition:width .1s linear}.quote{font-size:35px;line-height:1.5}strong{font-weight:600}ul{padding-left:34px;margin:8px 0}li{margin:13px 0}
</style><header><span>SECURE SERVICE DESK</span><span>SAVED EVIDENCE WALKTHROUGH | SYNTHETIC LAB</span></header><div id="kicker" class="kicker"></div><h1 id="title"></h1><div id="content" class="content"></div><footer><span id="source"></span><span id="number"></span></footer><div id="bar"></div><script>
const slides=__SLIDES__;const started=performance.now();const total=slides.reduce((a,s)=>a+s.duration,0);let current=-1;const pinned=new URLSearchParams(location.search).get('slide');
function tick(){let elapsed=(performance.now()-started)/1000;let index=0,left=elapsed;while(index<slides.length-1&&left>=slides[index].duration){left-=slides[index].duration;index++}if(pinned!==null)index=Math.max(0,Math.min(slides.length-1,Number(pinned)));if(index!==current){current=index;const s=slides[index];document.getElementById('kicker').textContent=s.kicker;document.getElementById('title').textContent=s.title;document.getElementById('content').innerHTML=s.html;document.getElementById('source').textContent=s.source;document.getElementById('number').textContent=(index+1)+' / '+slides.length}document.getElementById('bar').style.width=Math.min(100,elapsed/total*100)+'%';requestAnimationFrame(tick)}tick();
</script></html>
